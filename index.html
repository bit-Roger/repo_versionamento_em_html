<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Versionamento - PCA</title>
<link rel="stylesheet" href="style.css"><!--comentário teste-->
</head>
<body>
<div id="modeloOverlay" class="modelo-overlay" aria-label="Seleção do modelo">
  <div class="modelo-box">
    <h2>Selecione o modelo</h2>
    <p>Escolha qual modelo será utilizado neste documento:</p>
    <div class="modelo-opcoes">
      <button type="button" class="modelo-opcao" data-modelo="PCA"><strong>PCA</strong><span>Prestação de Contas e Auditoria</span></button>
      <button type="button" class="modelo-opcao" data-modelo="CIA"><strong>CIA</strong><span>Controle Interno e Auditoria</span></button>
      <button type="button" class="modelo-opcao" data-modelo="PTM"><strong>PTM</strong><span>Portal da Transparência Municipal</span></button>
      <button type="button" class="modelo-opcao" data-modelo="PTM_Adm"><strong>PTM_Adm</strong><span>Portal da Transparência Municipal Administrativo</span></button>
    </div>
  </div>
</div>
<div class="page">
 <header class="top">
  <div class="brand">
    <div class="logo">
      <img src="image.png" alt="EL Produções de Software">
    </div>

    <div>
      <h1 id="tituloSistema">ATUALIZAÇÃO DO SISTEMA</h1>
      <p id="nomeSistema">Selecione o modelo</p>
    </div>
  </div>
</header>
  <main>
    <div class="wrap">
      <p class="sub" id="textoIntroducao"></p>

<div id="avisoEdicao" class="aviso-edicao" hidden>
  <span>Editando o PDF salvo <strong id="avisoEdicaoNome"></strong>. Ao salvar, ele será atualizado.</span>
  <button type="button" id="btnNovoDocumento" class="btn-item">Novo documento</button>
</div>

<div class="painel">

  <div id="conteudoContainer"></div>

  <div class="linha-botoes">

    <button
      type="button"
      id="btnAdicionarVersao"
      class="btn-secao">
      + Adicionar versão
    </button>

    <button
      type="button"
      id="btnAdicionarSecao"
      class="btn-secao">
      + Adicionar seção
    </button>

  </div>

</div>
<div class="linha-botoes">

  <button
    type="button"
    id="btnGerarPDF"
    class="btn-pdf">
    Gerar / Salvar PDF
  </button>

  <button
    type="button"
    id="btnPdfsAnteriores"
    class="btn-item">
    PDFs anteriores
  </button>

</div>
    <div id="printContainer" aria-hidden="true"></div>
    <div id="historicoOverlay" class="modelo-overlay fechado" aria-hidden="true" aria-label="PDFs anteriores">
      <div class="modelo-box historico-box">
        <h2>PDFs anteriores</h2>
        <div class="historico-filtro">
          <label for="historicoModelo">Sistema</label>
          <select id="historicoModelo">
            <option value="">Todos</option>
            <option value="PCA">PCA</option>
            <option value="CIA">CIA</option>
            <option value="PTM">PTM</option>
            <option value="PTM_Adm">PTM_Adm</option>
          </select>
        </div>
        <p id="historicoStatus" class="historico-status"></p>
        <ul id="historicoLista" class="historico-lista"></ul>
        <div class="linha-botoes historico-rodape">
          <button type="button" id="btnFecharHistorico" class="btn-item">Fechar</button>
        </div>
      </div>
    </div>
  </main>
  <footer class="bottom"><div><div class="company">EL PRODUÇÕES DE SOFTWARE</div><div class="tagline">Soluções tecnológicas para uma gestão pública mais eficiente.</div></div></footer>
</div>
<script src="libs/html2canvas.min.js"></script>
<script src="libs/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
